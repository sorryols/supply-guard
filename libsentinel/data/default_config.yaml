# Конфігурація LibSentinel за замовчуванням.
# Значення відповідають таблиці 2.1 та підрозділу 2.1 роботи.
# Щоб змінити параметри, скопіюйте файл і передайте його через --config.

thresholds:
  warn: 0.3        # θ1 — поріг попередження
  block: 0.7       # θ2 — поріг блокування
  dynamic: 0.3     # θd — поріг запуску динамічного аналізу

# Ваги індикаторів p_k (таблиця 2.1)
weights:
  A1: 0.5   # зміна видавця або зникнення атестації
  A2: 0.4   # новий власник або супровідник
  A3: 0.4   # низька довіра до авторів змін (x = 1 - τ)
  A4: 0.3   # аномальна періодичність релізів
  A5: 0.3   # відсутність тегу версії в репозиторії
  S1: 0.4   # зміна коду, що виконується під час встановлення
  S2: 0.4   # нові небезпечні виклики
  S3: 0.3   # нові мережеві можливості
  S4: 0.5   # доступ до чутливих даних
  S5: 0.3   # рядки з високою ентропією
  S6: 0.4   # файли пакета, відсутні в репозиторії
  D1: 0.2   # нова пряма залежність
  D2: 0.5   # схожість назви залежності на популярну
  D3: 0.4   # нова або малоактивна залежність
  D4: 0.1   # відомі вразливості
  B1: 0.7   # мережеві з'єднання з недозволеними хостами
  B2: 0.5   # запуск оболонки чи інших програм
  B3: 0.6   # запис за межами каталогу бібліотеки

# Рівні довіри до авторів змін t_j (формула 2.3)
trust:
  maintainer: 1.0
  contributor: 0.6
  newcomer: 0.2
  unknown: 0.0
  max_commits: 100          # максимальна кількість комітів для аналізу
  maintainer_min_commits: 50  # без токена: скільки попередніх комітів робить автора супровідником
  missing_tag_policy: zero  # zero — зміни без тегів отримують t=0 (як у розділі 2); skip — A3 не оцінюється

metadata:
  long_pause_days: 365      # A4: перерва між релізами, що вважається довгою
  pause_median_factor: 3    # A4: у скільки разів перерва має перевищувати медіану
  burst_window_hours: 24    # A4: вікно для виявлення серії релізів
  burst_count: 3            # A4: кількість релізів у вікні

sast:
  entropy_min_length: 100   # S5: мінімальна довжина рядка
  entropy_low: 4.5          # S5: ентропія, з якої індикатор починає зростати
  entropy_high: 6.0         # S5: ентропія, за якої індикатор дорівнює 1

deps:
  new_package_days: 30      # D3: вік першого релізу
  small_release_count: 3    # D3: кількість релізів малоактивної бібліотеки
  typo_max_distance: 2      # D2: максимальна відстань Левенштейна
  ossf_dir: ""              # локальна копія ossf/malicious-packages (заповнюється командою update-data)

dast:
  enabled: true
  image: "libsentinel-sandbox:1.0"
  runtime: ""               # "runsc" для gVisor; порожньо — стандартний runc
  timeout_seconds: 180
  memory: "1g"
  pids_limit: 256
  clear_s1_if_clean: true   # зняти S1, якщо код встановлення виконано в пісочниці без шкідливої поведінки
  # Програми, запуск яких під час встановлення вважається нормальним
  allowed_programs:
    - python
    - python3
    - pip
    - gcc
    - cc
    - c++
    - g++
    - x86_64-linux-gnu-gcc
    - ld
    - as
    - git
    - uname
    - ldconfig
  # Хости, з'єднання з якими вважаються дозволеними (мережа в контейнері все одно вимкнена)
  allowed_hosts:
    - 127.0.0.1
    - ::1

network:
  timeout_seconds: 20
  user_agent: "LibSentinel/1.0 (+https://github.com/)"

cache:
  enabled: true
  http_ttl_hours: 6
