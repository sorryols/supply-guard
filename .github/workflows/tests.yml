# Робочий процес репозиторію LibSentinel: блокові та інтеграційні тести.
name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q -k "not dynamic"

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Збирання пісочниці
        run: libsentinel sandbox-build
      - name: Тести з динамічним аналізом
        run: pytest -q tests/test_integration.py
      - name: Експеримент на синтетичних зразках
        run: |
          python experiments/make_synthetic.py
          python experiments/run_experiment.py experiments/synthetic/synthetic.csv --out experiments/results
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: experiments/results
