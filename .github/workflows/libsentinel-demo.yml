name: LibSentinel demo (SAST і DAST)

on:
  pull_request:
    paths:
      - "demo/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sast-dast-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Встановлення LibSentinel
        run: python -m pip install .

      - name: Пісочниця і демо-пакети
        run: |
          libsentinel sandbox-build
          python experiments/make_synthetic.py --out demo/synthetic

      - name: SAST — base64-код під час імпорту (1.1.1)
        run: |
          set +e
          libsentinel analyze libsentinel-demo --from 1.0.0 --to 1.1.1 \
            --old-archive demo/synthetic/libsentinel-demo-1.0.0.tar.gz \
            --new-archive demo/synthetic/libsentinel-demo-1.1.1.tar.gz \
            --offline --dast never --no-color --json sast.json --sarif sast.sarif
          echo "SAST_CODE=$?" >> "$GITHUB_ENV"

      - name: DAST — обфускований setup.py у пісочниці (1.1.3)
        run: |
          set +e
          libsentinel analyze libsentinel-demo --from 1.0.0 --to 1.1.3 \
            --old-archive demo/synthetic/libsentinel-demo-1.0.0.tar.gz \
            --new-archive demo/synthetic/libsentinel-demo-1.1.3.tar.gz \
            --offline --dast always --no-color --json dast.json --sarif dast.sarif
          echo "DAST_CODE=$?" >> "$GITHUB_ENV"

      - name: Підсумок
        run: |
          python -c "import json; print(json.dumps([json.load(open('sast.json')), json.load(open('dast.json'))]))" > demo.json
          python ci/summary.py demo.json >> "$GITHUB_STEP_SUMMARY"
          python ci/demo_sarif.py demo.sarif sast.sarif dast.sarif

      - name: Завантаження SARIF у вкладку Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: demo.sarif
          category: libsentinel-demo
        continue-on-error: true

      - name: Рішення
        run: |
          echo "SAST: код $SAST_CODE, DAST: код $DAST_CODE"
          if [ "$SAST_CODE" = "2" ] || [ "$DAST_CODE" = "2" ]; then
            echo "::error::LibSentinel: шкідливі оновлення заблоковано (SAST і DAST)"
            exit 2
          fi
