[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "libsentinel"
version = "1.1.0"
description = "Засіб аналізу безпеки оновлень бібліотек з відкритим кодом (PyPI)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Іван Заремба" }]
dependencies = [
    "requests>=2.28",
    "packaging>=21.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
libsentinel = "libsentinel.main:main"

[tool.setuptools]
packages = ["libsentinel"]

[tool.setuptools.package-data]
libsentinel = ["data/*", "sandbox/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
